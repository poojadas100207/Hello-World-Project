<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A fast, accessible current weather lookup.">
  <title>Weather Lab Capstone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">Capstone project</p>
    <h1>Weather Lab</h1>
    <p class="lede">A small, dependable interface for checking current conditions anywhere.</p>
    <form id="search-form">
      <label for="city">Search city</label>
      <div class="controls"><input id="city" name="city" value="London" required><button type="submit">Search</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
